<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI Blog Builder — Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E37535'/%3E%3Cstop offset='1' stop-color='%239A133C'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='800' fill='white' text-anchor='middle'%3EAB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --bg:#F6F5FB; --bg-alt:#EFEDF4; --surface:#FFFFFF;
  --ink:#141414; --ink-soft:#4A4A4A; --muted:#8A8694; --line:#E5E2E9;
  --violet:#9A133C; --magenta:#C73340; --orange:#E37535;
  --grad:linear-gradient(120deg,#E37535 0%,#C73340 55%,#9A133C 100%);
  --grad-soft:linear-gradient(120deg,rgba(227,117,53,.12),rgba(154,19,60,.10));
  --ok:#15803D; --ok-bg:#E7F5EC; --warn:#B45309; --warn-bg:#FEF3C7; --err:#B91C1C; --err-bg:#FDECEA;
  --radius:18px; --radius-sm:12px;
  --shadow:0 10px 30px rgba(20,20,20,.08); --shadow-lg:0 24px 60px rgba(20,20,20,.14);
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.2;letter-spacing:-.01em}
p{margin:0}a{color:var(--violet);text-decoration:none}a:hover{text-decoration:underline}

/* Layout: sidebar + main */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;min-width:230px;background:var(--surface);border-right:1px solid var(--line);padding:24px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side-logo{font-family:var(--font-display);font-weight:800;font-size:18px;padding:0 12px 20px;color:var(--ink)}
.side-logo .dot{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;border:none;background:none;text-align:left;width:100%;font-family:var(--font-body)}
.nav-item:hover{background:var(--bg-alt);color:var(--ink);text-decoration:none}
.nav-item.active{background:var(--grad-soft);color:var(--violet)}
.nav-item .ico{width:18px;text-align:center}
.side-sep{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:18px 12px 6px}
.main{flex:1;padding:32px 36px 64px;max-width:1160px}

.topline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:26px}
.topline h1{font-size:26px}
.live-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13px}
.live-pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;font-weight:700;font-size:14.5px;font-family:var(--font-body);cursor:pointer;border:none;transition:transform .15s,box-shadow .15s,filter .15s;text-decoration:none}
.btn:hover{transform:translateY(-2px);text-decoration:none}
.btn-primary{background:var(--grad);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{box-shadow:var(--shadow-lg);filter:brightness(1.05)}
.btn-outline{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-outline:hover{border-color:var(--violet);color:var(--violet)}
.btn-sm{padding:9px 16px;font-size:13.5px;border-radius:11px}

/* Gate */
.gate{max-width:460px;margin:12vh auto 0;text-align:center;padding:0 20px}
.gate h1{font-size:26px;margin-bottom:8px}
.gate .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.gate p{color:var(--muted);margin-bottom:26px}
.gate-row{display:flex;gap:10px}
.gate-row input{flex:1;padding:13px 16px;border:1.5px solid var(--line);border-radius:14px;font-size:15px;font-family:var(--font-mono);background:var(--surface)}
.gate-row input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(199,51,64,.14)}

.msg{font-size:14px;padding:11px 15px;border-radius:12px;margin-top:14px;display:none;font-weight:600}
.msg.show{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--err-bg);color:var(--err)}
.msg.info{background:var(--grad-soft);color:var(--violet)}.msg.warn{background:var(--warn-bg);color:var(--warn)}

/* Panels & cards */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px;box-shadow:0 4px 16px rgba(20,20,20,.05)}
.panel-title{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:16px;margin-bottom:18px}
.panel-title .pico{width:30px;height:30px;border-radius:9px;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;font-size:14px}

.tenants{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad)}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tcard h3{font-size:17px;margin-bottom:3px}
.tcard .url{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin-bottom:14px;word-break:break-all}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em}
.badge.gh{background:#1E1C24;color:#F0D48A}
.badge.wp{background:#E0E7FF;color:#3730A3}
.badge.active{background:var(--ok-bg);color:var(--ok)}
.badge.paused{background:var(--warn-bg);color:var(--warn)}
.tcard-meta{display:flex;gap:8px;flex-wrap:wrap}

/* Stats row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden}
.stat .n{font-family:var(--font-display);font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .l{font-family:var(--font-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin-top:4px}
.stat.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--violet)}
.stat.clickable[data-busy="1"]{opacity:.55;pointer-events:none}
.stat .hint{font-family:var(--font-mono);font-size:9px;color:var(--muted);letter-spacing:.1em;margin-top:6px;opacity:.7}

/* Toast */
.toast{position:fixed;right:22px;bottom:22px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:1000;max-width:320px}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}

/* Day-of-week mini pills (Publish days stat card) */
.day-mini-pills{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:6px 0 2px}
.day-mini{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--bg-alt);color:var(--muted);font-family:var(--font-mono);font-size:11px;font-weight:700;cursor:pointer;user-select:none;transition:background .12s,color .12s,transform .1s}
.day-mini:hover{transform:scale(1.08)}
.day-mini.selected{background:var(--violet);color:#fff}
.stat[data-busy="1"] .day-mini{pointer-events:none}

/* Detail head */
.back{background:none;border:0;color:var(--violet);font-size:14px;font-weight:700;cursor:pointer;padding:0;margin-bottom:18px;font-family:var(--font-body)}
.detail-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}
.detail-head h2{font-size:23px}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.1em;padding:5px 0}
.cal .day{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;padding:5px 6px;font-size:12px;min-height:48px;background:var(--surface)}
.cal .day.empty{border:none;background:transparent}
.cal .day .dn{color:var(--muted);font-size:11px;font-weight:600}
.cal .day.has{background:var(--grad-soft);border-color:rgba(154,19,60,.35)}
.cal .day.published{background:var(--ok-bg);border-color:rgba(21,128,61,.4)}
.cal .day.published:has(a):hover{background:#D4EDDA;cursor:pointer}
.cal .day.has.published{background:linear-gradient(135deg,var(--ok-bg) 50%,rgba(227,117,53,.12) 50%);border-color:rgba(21,128,61,.4)}
.cal .day.today{box-shadow:0 0 0 2px var(--violet)}
.cal .day .topic{font-size:9px;line-height:1.25;color:var(--violet);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-weight:600}
.cal .day .plan-time{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--orange);margin-top:2px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav button{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.cal-nav button:hover{border-color:var(--violet);color:var(--violet)}
.cal-nav .mlabel{font-family:var(--font-display);font-weight:800;font-size:15px}

/* History */
.hist{list-style:none;padding:0;margin:0}
.hist li{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.hist li:last-child{border-bottom:none}
.hist .ht{font-size:14px;font-weight:600}
.hist .ht a{color:var(--ink)}.hist .ht a:hover{color:var(--violet);text-decoration:none}
.hist .hd{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);white-space:nowrap;padding-top:2px}

.empty{color:var(--muted);font-size:14px;text-align:center;padding:34px}
.spinner{text-align:center;padding:44px;color:var(--muted)}

@media(max-width:760px){
  .sidebar{display:none}
  .main{padding:22px 16px 48px}
}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate" class="gate">
  <h1>AI Blog Builder <span class="grad-text">Dashboard</span></h1>
  <p>Enter your operator secret to view all tenants.</p>
  <div class="gate-row">
    <form id="gateForm" onsubmit="event.preventDefault();verifyGate()" autocomplete="on">
      <input type="text" name="username" value="abb-operator" autocomplete="username" style="display:none" tabindex="-1">
      <div style="display:flex;gap:10px">
        <input id="gateKey" type="password" name="password" placeholder="ABB_APP_SECRET" autocomplete="current-password" style="flex:1">
        <button type="submit" class="btn btn-primary" id="gateBtn">Enter</button>
      </div>
    </form>
  </div>
  <div id="gateMsg" class="msg"></div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">
  <aside class="sidebar">
    <div class="side-logo">AI Blog<span class="dot">Builder</span></div>
    <button class="nav-item active" onclick="showList()"><span class="ico">▦</span> Overview</button>
    <div class="side-sep">Tools</div>
    <a class="nav-item" href="/app/index.html"><span class="ico">＋</span> New tenant</a>
    <a class="nav-item" href="/abb-setup.html"><span class="ico">⚙</span> Setup page</a>
    <button class="nav-item" onclick="loadTenants()"><span class="ico">↻</span> Refresh</button>
  </aside>

  <main class="main">
    <!-- LIST VIEW -->
    <div id="listView">
      <div class="topline">
        <h1>Overview</h1>
        <span class="live-pill">Live</span>
      </div>
      <div id="globalStats" class="stats"></div>
      <div class="panel">
        <div class="panel-title"><span class="pico">▦</span> Tenants</div>
        <div id="tenantList" class="spinner">Loading tenants…</div>
      </div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" style="display:none">
      <button class="back" onclick="showList()">← All tenants</button>
      <div id="detailBody"><div class="spinner">Loading…</div></div>
    </div>
  </main>
</div>

<script>
var $ = function(id) { return document.getElementById(id); };
var API = "/api/app";
var SECRET = "";
var TENANTS = [];

// Auto-login from sessionStorage (shared across dashboard + setup)
(function autoLogin() {
  try {
    var saved = sessionStorage.getItem("abb_secret");
    if (saved) { $("gateKey").value = saved; verifyGate(); }
  } catch(e) {}
})();

async function api(method, path, body) {
  var opts = { method: method, headers: { "x-app-secret": SECRET } };
  if (body != null) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  var r = await fetch(API + path, opts);
  var data = await r.json().catch(function() { return {}; });
  return { ok: r.ok, status: r.status, data: data };
}

async function verifyGate() {
  var key = $("gateKey").value.trim();
  if (!key) { showMsg("gateMsg","err","Enter your operator secret."); return; }
  $("gateBtn").disabled = true; $("gateBtn").textContent = "Checking\u2026";
  SECRET = key;
  var r = await api("GET", "/tenants");
  $("gateBtn").disabled = false; $("gateBtn").textContent = "Enter";
  if (r.ok && r.data.ok) {
    try { sessionStorage.setItem("abb_secret", key); } catch(e) {}
    $("gate").style.display = "none";
    $("app").style.display = "flex";
    TENANTS = r.data.tenants || [];
    renderTenants(TENANTS);
  } else {
    SECRET = "";
    showMsg("gateMsg","err", r.data.error || "Wrong secret or server error.");
  }
}

function showMsg(id, kind, text) { var e=$(id); e.className="msg show "+kind; e.textContent=text; }

async function loadTenants() {
  showList();
  $("tenantList").className = "spinner";
  $("tenantList").textContent = "Loading tenants\u2026";
  var r = await api("GET", "/tenants");
  if (r.ok && r.data.ok) { TENANTS = r.data.tenants || []; renderTenants(TENANTS); }
  else { $("tenantList").className=""; $("tenantList").innerHTML = '<div class="empty">Could not load tenants.</div>'; }
}

function renderTenants(tenants) {
  // Global stats
  var active = tenants.filter(function(t) { return t.status === "active"; }).length;
  $("globalStats").innerHTML =
    '<div class="stat"><div class="n">' + tenants.length + '</div><div class="l">Tenants</div></div>' +
    '<div class="stat"><div class="n">' + active + '</div><div class="l">Active</div></div>' +
    '<div class="stat"><div class="n">' + (tenants.length - active) + '</div><div class="l">Paused</div></div>';

  var el = $("tenantList");
  if (!tenants.length) { el.className=""; el.innerHTML = '<div class="empty">No tenants yet. <a href="/app/index.html">Add your first one \u2192</a></div>'; return; }
  el.className = "tenants";
  el.innerHTML = tenants.map(function(t) {
    return '<div class="tcard" onclick="openTenant(\'' + encodeURIComponent(t.id) + '\')">' +
      '<h3>' + escapeHtml(t.siteName || t.id) + '</h3>' +
      '<div class="url">' + escapeHtml(t.id) + '</div>' +
      '<div class="tcard-meta"><span class="badge ' + (t.status==='active'?'active':'paused') + '">' + escapeHtml(t.status||'active') + '</span></div></div>';
  }).join("");
}

// Current detail-view tenant (for inline edits like the Int. links toggle)
var currentTenantId = null;
var currentProfile = null;

function showList() { $("listView").style.display="block"; $("detailView").style.display="none"; calRef=null; currentTenantId=null; currentProfile=null; }

async function openTenant(encId) {
  var id = decodeURIComponent(encId);
  $("listView").style.display = "none";
  $("detailView").style.display = "block";
  $("detailBody").innerHTML = '<div class="spinner">Loading ' + escapeHtml(id) + '\u2026</div>';

  var results = await Promise.all([
    api("GET", "/tenants?id=" + encodeURIComponent(id)),
    api("GET", "/queue?id=" + encodeURIComponent(id)),
  ]);

  var profRes = results[0];
  var queueRes = results[1];
  var profile = profRes.ok && profRes.data.ok ? profRes.data.profile : {};
  var q = queueRes.ok && queueRes.data.ok ? queueRes.data : { queue:[], history:[], plan:null };
  renderDetail(id, profile, q);
}

function renderDetail(id, profile, q) {
  // Stash for inline edits (Int. links toggle) — full profile round-trip on save
  currentTenantId = id;
  currentProfile = profile || {};

  var queue = q.queue || [];
  var history = q.history || [];
  var plan = q.plan;
  var intType = (profile.integration && profile.integration.type) || "wordpress";
  var intBadge = intType==="github-static" ? '<span class="badge gh">GitHub</span>' : '<span class="badge wp">WordPress</span>';
  var linking = (profile.authority && profile.authority.enabled) ? "On" : "Off";

  // Publish days pills — 7 clickable letter pills. Missing/empty publishDays = all 7 (backward compat).
  var DAY_ORDER = ["mon","tue","wed","thu","fri","sat","sun"];
  var dayLetters = { mon:"M", tue:"T", wed:"W", thu:"T", fri:"F", sat:"S", sun:"S" };
  var pubDays = Array.isArray(profile.publishDays) && profile.publishDays.length ? profile.publishDays : DAY_ORDER;
  var pubDaysPills = DAY_ORDER.map(function(d, i) {
    var sel = pubDays.indexOf(d) !== -1;
    // event.stopPropagation prevents the outer .stat wrapper from swallowing the click if it ever gets one
    return '<span class="day-mini' + (sel ? ' selected' : '') + '" data-day="' + d + '" onclick="event.stopPropagation();toggleDayPill(\'' + d + '\')" title="' + ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"][i] + '">' + dayLetters[d] + '</span>';
  }).join("");

  // ── "Next Up" stat: show plan target time if pending, otherwise next queue date ──
  var nextUpDisplay = "\u2014";
  var nextUpLabel = "Next up";
  if (plan && (plan.status === "pending" || plan.status === "publishing") && plan.target) {
    nextUpDisplay = plan.target;
    nextUpLabel = "Publishes at";
  } else if (plan && plan.status === "done") {
    // Today's done — show next queue item date
    var nextItem = queue.length ? (queue.find(function(e) { return e.date; }) || queue[0]) : null;
    nextUpDisplay = nextItem && nextItem.date ? nextItem.date : "\u2713 Done";
    nextUpLabel = "Next up";
  } else {
    var nextItem2 = queue.length ? (queue.find(function(e) { return e.date; }) || queue[0]) : null;
    nextUpDisplay = nextItem2 && nextItem2.date ? nextItem2.date : "\u2014";
  }

  var html = '<div class="detail-head">' +
    '<h2>' + escapeHtml(profile.siteName || id) + '</h2>' +
    '<div style="display:flex;gap:8px;align-items:center">' + intBadge +
    '<span class="badge ' + ((profile.status||'active')==='active'?'active':'paused') + '">' + escapeHtml(profile.status||'active') + '</span></div></div>' +
    '<div class="stats">' +
    '<div class="stat"><div class="n">' + queue.length + '</div><div class="l">Queued</div></div>' +
    '<div class="stat"><div class="n">' + history.length + '</div><div class="l">Published</div></div>' +
    '<div class="stat"><div class="n" style="font-size:' + (nextUpDisplay.length <= 5 ? '30' : '19') + 'px;padding-top:' + (nextUpDisplay.length <= 5 ? '0' : '8') + 'px">' + escapeHtml(nextUpDisplay) + '</div><div class="l">' + escapeHtml(nextUpLabel) + '</div></div>' +
    '<div class="stat"><div class="n">' + escapeHtml((profile.primaryLanguage||'\u2014').toUpperCase()) + '</div><div class="l">Language</div></div>' +
    '<div class="stat clickable" id="intLinksStat" onclick="toggleIntLinks()" title="Click to toggle internal linking"><div class="n" id="intLinksVal" style="font-size:22px;padding-top:5px">' + linking + '</div><div class="l">Int. links</div><div class="hint">click to toggle</div></div>' +
    '<div class="stat" id="daysStat"><div class="day-mini-pills" id="daysPills">' + pubDaysPills + '</div><div class="l">Publish days</div><div class="hint">click letters to toggle</div></div>' +
    '</div>';

  if (plan) {
    var ps = plan.status || "\u2014";
    var planParts = "Today\u2019s plan: <strong>" + escapeHtml(ps) + "</strong>";
    if (plan.target) planParts += " \u00B7 target " + escapeHtml(plan.target);
    if (plan.topic) planParts += " \u00B7 " + escapeHtml(plan.topic);
    html += '<div class="msg info show" style="margin:0 0 22px">' + planParts + '</div>';
  }

  html += '<div class="panel"><div class="panel-title"><span class="pico">\u25A4</span> Content calendar</div><div id="calMount"></div></div>';

  html += '<div class="panel"><div class="panel-title"><span class="pico">\u2713</span> Recent posts</div>';
  if (!history.length) html += '<div class="empty">No posts published yet.</div>';
  else {
    html += '<ul class="hist">' + history.slice(0,15).map(function(h) {
      var d = (h.published_at||"").slice(0,10);
      var url = h.url ? (h.url.startsWith("http")?h.url:"https://"+h.url) : null;
      var title = escapeHtml(h.title||h.topic||"Untitled");
      return '<li><span class="ht">' + (url ? '<a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + title + '</a>' : title) + '</span><span class="hd">' + escapeHtml(d) + '</span></li>';
    }).join("") + '</ul>';
  }
  html += '</div>';

  $("detailBody").innerHTML = html;
  renderCalendar(queue, history, plan);
}

/* ─── Calendar ─── */
var calRef = null;
var calHistory = [];
var calPlan = null;
var calTodayStr = null; // "YYYY-MM-DD" — set at draw time so we can tell future from today

function renderCalendar(queue, history, plan) {
  var byDate = {};
  queue.forEach(function(e) { if (e.date) { if (!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); } });
  var pubDates = new Set();
  (history || calHistory || []).forEach(function(h) {
    var d = (h.published_at||"").slice(0,10);
    if (d) pubDates.add(d);
  });
  calHistory = history || calHistory;
  calPlan = plan || null;
  var dates = Object.keys(byDate).sort();
  var first = dates[0] || new Date().toISOString().slice(0,10);
  if (!calRef) { var parts = first.split("-"); calRef = { y: parseInt(parts[0]), m: parseInt(parts[1]) - 1 }; }
  drawCalendar(byDate, pubDates);
}

function drawCalendar(byDate, pubDates) {
  var mount = $("calMount");
  if (!mount) return;
  pubDates = pubDates || new Set();
  var y = calRef.y, m = calRef.m;
  var monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var first = new Date(Date.UTC(y, m, 1));
  var startDow = (first.getUTCDay() + 6) % 7;
  var daysInMonth = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  var todayStr = new Date().toISOString().slice(0,10);
  calTodayStr = todayStr;

  var html = '<div class="cal-nav">' +
    '<button onclick="calMove(-1)">\u2190</button>' +
    '<span class="mlabel">' + monthNames[m] + ' ' + y + '</span>' +
    '<button onclick="calMove(1)">\u2192</button>' +
    '</div><div class="cal">';
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d) { html += '<div class="dow">' + d + '</div>'; });
  for (var i=0; i<startDow; i++) html += '<div class="day empty"></div>';
  for (var d=1; d<=daysInMonth; d++) {
    var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    var items = byDate[ds] || [];
    var isPublished = pubDates.has(ds);
    // Published wins — solid green, no half-and-half split
    var cls = "day" + (items.length && !isPublished ? " has" : "") + (isPublished ? " published" : "") + (ds===todayStr ? " today" : "");

    // Build cell content
    var cellContent = "";

    // Today's cell: show plan topic + time (not the queue's first item)
    if (ds === todayStr && calPlan && (calPlan.status === "pending" || calPlan.status === "publishing")) {
      if (calPlan.target) cellContent += '<div class="plan-time">\u23F3 ' + escapeHtml(calPlan.target) + '</div>';
      if (calPlan.topic) cellContent += '<div class="topic">' + escapeHtml(calPlan.topic) + '</div>';
    } else if (isPublished) {
      var pubTime = getPubTime(ds);
      cellContent += '<div class="plan-time" style="color:var(--ok)">\u2713 ' + (pubTime || 'Published') + '</div>';
      var pubTopic = getPubTopic(ds);
      if (pubTopic) cellContent += '<div class="topic" style="color:var(--ok)">' + escapeHtml(pubTopic) + '</div>';
      var pubUrl = getPubUrl(ds);
      if (pubUrl) cellContent = '<a href="' + escapeHtml(pubUrl) + '" target="_blank" rel="noopener" style="display:block;color:inherit;text-decoration:none;height:100%">' + cellContent + '</a>';
    } else if (items.length) {
      // Future queued item — show its pre-rolled scheduledTime if present
      var st = items[0].scheduledTime;
      if (typeof st === "string" && /^\d\d:\d\d$/.test(st)) {
        cellContent += '<div class="plan-time">\u23F3 ' + escapeHtml(st) + '</div>';
      }
      cellContent += '<div class="topic">' + escapeHtml(items[0].topic||"") + '</div>';
    }

    html += '<div class="' + cls + '"><div class="dn">' + d + '</div>' + cellContent + '</div>';
  }
  html += '</div>';
  mount.innerHTML = html;
  mount._byDate = byDate;
  mount._pubDates = pubDates;
}

// Look up the publish time (HH:MM in browser local tz) for a given date
function getPubTime(dateStr) {
  for (var i = 0; i < (calHistory || []).length; i++) {
    var h = calHistory[i];
    if ((h.published_at || "").slice(0, 10) === dateStr) {
      var dt = new Date(h.published_at);
      if (!isNaN(dt.getTime())) return String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
    }
  }
  return null;
}

// Look up the topic/title from history for a given date
function getPubTopic(dateStr) {
  for (var i = 0; i < (calHistory || []).length; i++) {
    var h = calHistory[i];
    if ((h.published_at || "").slice(0, 10) === dateStr) {
      return h.title || h.topic || null;
    }
  }
  return null;
}

// Look up the post URL from history for a given date
function getPubUrl(dateStr) {
  for (var i = 0; i < (calHistory || []).length; i++) {
    var h = calHistory[i];
    if ((h.published_at || "").slice(0, 10) === dateStr) {
      if (!h.url) return null;
      return h.url.startsWith("http") ? h.url : "https://" + h.url;
    }
  }
  return null;
}

function calMove(delta) {
  calRef.m += delta;
  if (calRef.m < 0) { calRef.m = 11; calRef.y--; }
  if (calRef.m > 11) { calRef.m = 0; calRef.y++; }
  var mount = $("calMount");
  var pubDates = new Set();
  (calHistory||[]).forEach(function(h) { var d=(h.published_at||"").slice(0,10); if(d) pubDates.add(d); });
  drawCalendar(mount._byDate || {}, pubDates);
}

/* ─── Int. links toggle ─── */
async function toggleIntLinks() {
  if (!currentTenantId || !currentProfile) return;
  var stat = $("intLinksStat");
  var valEl = $("intLinksVal");
  if (!stat || !valEl) return;
  if (stat.dataset.busy === "1") return;

  var currentEnabled = !!(currentProfile.authority && currentProfile.authority.enabled);
  var newEnabled = !currentEnabled;

  // Optimistic UI
  stat.dataset.busy = "1";
  valEl.textContent = newEnabled ? "On" : "Off";

  // Full-profile save — clone, flip authority.enabled, POST update
  var newProfile;
  try { newProfile = JSON.parse(JSON.stringify(currentProfile)); }
  catch(e) { newProfile = Object.assign({}, currentProfile); }
  if (!newProfile.authority || typeof newProfile.authority !== "object") newProfile.authority = {};
  newProfile.authority.enabled = newEnabled;

  var r = await api("POST", "/tenants", { action: "update", id: currentTenantId, profile: newProfile });
  stat.dataset.busy = "";

  if (r.ok && r.data && r.data.ok) {
    // Update only the flag on our working copy — server returns publicProfile (filtered),
    // so overwriting currentProfile wholesale could drop non-public fields on next toggle.
    if (!currentProfile.authority || typeof currentProfile.authority !== "object") currentProfile.authority = {};
    currentProfile.authority.enabled = newEnabled;
    valEl.textContent = newEnabled ? "On" : "Off";
    showToast("Internal links " + (newEnabled ? "on" : "off"), "ok");
  } else {
    // Revert on failure
    valEl.textContent = currentEnabled ? "On" : "Off";
    showToast((r.data && r.data.error) || "Save failed", "err");
  }
}

/* ─── Toast ─── */
function showToast(text, kind) {
  var t = $("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = text;
  t.className = "toast show " + (kind === "err" ? "err" : "ok");
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(function() { t.className = "toast " + (kind === "err" ? "err" : "ok"); }, 2400);
}

/* ─── Publish days pill toggle ─── */
var _daysSaveTimer = null;
var DAY_ORDER_JS = ["mon","tue","wed","thu","fri","sat","sun"];

function toggleDayPill(d) {
  var el = document.querySelector('.day-mini[data-day="' + d + '"]');
  if (!el) return;
  el.classList.toggle("selected");
  // Debounce so tapping 3 pills in a row = 1 network call, not 3
  clearTimeout(_daysSaveTimer);
  _daysSaveTimer = setTimeout(saveDays, 800);
}

function currentSelectedDays() {
  var picked = [];
  document.querySelectorAll('.day-mini.selected').forEach(function(el) {
    picked.push(el.dataset.day);
  });
  // Preserve canonical order regardless of DOM order
  return DAY_ORDER_JS.filter(function(d) { return picked.indexOf(d) !== -1; });
}

function paintDayPills(days) {
  document.querySelectorAll('.day-mini').forEach(function(el) {
    el.classList.toggle("selected", days.indexOf(el.dataset.day) !== -1);
  });
}

async function saveDays() {
  if (!currentTenantId || !currentProfile) return;
  var stat = $("daysStat");
  if (!stat) return;

  var newDays = currentSelectedDays();

  // Previously-saved state (for revert on failure).
  // Missing/empty publishDays in profile = all 7 (backward-compat display).
  var prevDays = (Array.isArray(currentProfile.publishDays) && currentProfile.publishDays.length)
    ? currentProfile.publishDays.slice()
    : DAY_ORDER_JS.slice();

  // Zero-days guard — never let the user "save nothing" (autopilot would halt).
  if (newDays.length === 0) {
    showToast("Pick at least 1 day", "err");
    paintDayPills(prevDays);
    return;
  }

  // No-op guard — nothing to save if selection matches what's stored
  if (newDays.length === prevDays.length && newDays.every(function(d, i) { return d === prevDays[i]; })) {
    return;
  }

  stat.dataset.busy = "1";

  var newProfile;
  try { newProfile = JSON.parse(JSON.stringify(currentProfile)); }
  catch(e) { newProfile = Object.assign({}, currentProfile); }
  newProfile.publishDays = newDays;

  var r = await api("POST", "/tenants", { action: "update", id: currentTenantId, profile: newProfile });

  if (!(r.ok && r.data && r.data.ok)) {
    stat.dataset.busy = "";
    paintDayPills(prevDays);
    showToast((r.data && r.data.error) || "Save failed", "err");
    return;
  }

  // Profile save succeeded — update working copy
  currentProfile.publishDays = newDays.slice();

  // Now automatically re-date the queue against the new schedule.
  // A profile-save success + redate failure is worth surfacing but shouldn't
  // revert the profile — the operator's intent to change days is real.
  var rd = await api("POST", "/queue", { action: "redate", id: currentTenantId });
  stat.dataset.busy = "";

  if (rd.ok && rd.data && rd.data.ok) {
    showToast("Publish days saved \u00B7 " + (rd.data.redated || 0) + " items re-dated", "ok");
    // Refresh calendar with the newly-dated queue (no full-page reload).
    // rd.data.queue is the updated queue; re-use current history + plan.
    renderCalendar(rd.data.queue || [], calHistory, calPlan);
  } else {
    showToast("Days saved, but re-date failed: " + ((rd.data && rd.data.error) || "unknown"), "err");
  }
}

function escapeHtml(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
</script>
